name: Validate
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  manifests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install Python dependencies
        run: pip install -r requirements-dev.txt
      - name: Install pinned validation tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .cache/bin
          cd .cache/bin
          curl -fsSL --retry 3 https://get.helm.sh/helm-v4.3.0-linux-amd64.tar.gz -o helm.tgz
          echo '86584a54def73570558f66f5111cc53dfed56689637ae32c1201205d494f54fb  helm.tgz' | sha256sum -c -
          tar -xzf helm.tgz --strip-components=1 linux-amd64/helm
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv5.8.2/kustomize_v5.8.2_linux_amd64.tar.gz -o kustomize.tgz
          echo '06af0a202c2b831207d0173f9c9cdb1b30abceca0747cb3fbb72792d26055c95  kustomize.tgz' | sha256sum -c -
          tar -xzf kustomize.tgz kustomize
          curl -fsSL --retry 3 https://github.com/yannh/kubeconform/releases/download/v0.8.0/kubeconform-linux-amd64.tar.gz -o kubeconform.tgz
          echo '9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883  kubeconform.tgz' | sha256sum -c -
          tar -xzf kubeconform.tgz kubeconform
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Render and validate
        run: python3 scripts/validate.py
      - name: Install pinned kind and kubectl
        run: |
          set -euo pipefail
          cd .cache/bin
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64 -o kind
          curl -fsSL --retry 3 https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum -o kind.sha256sum
          sed 's/kind-linux-amd64/kind/' kind.sha256sum | sha256sum -c -
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl -o kubectl
          curl -fsSL --retry 3 https://dl.k8s.io/release/v1.36.4/bin/linux/amd64/kubectl.sha256 -o kubectl.sha256
          echo "$(cat kubectl.sha256)  kubectl" | sha256sum -c -
          chmod +x kind kubectl
      - name: Exercise native CNPG admission policy
        run: |
          kind create cluster --name storage-policy --wait 120s \
            --image kindest/node:v1.36.4@sha256:099e049362a1526b2db71494e1947aae99bd16290d7c895f2b7ea312e3cbfaed
          python3 scripts/test-policy.py
      - name: Delete disposable policy cluster
        if: always()
        run: if command -v kind >/dev/null; then kind delete cluster --name storage-policy; fi
