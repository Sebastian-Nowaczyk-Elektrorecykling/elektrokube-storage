apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: elektrokube-storage
  namespace: flux-system
  labels:
    app.kubernetes.io/part-of: elektrokube-storage
spec:
  interval: 5m
  retryInterval: 1m
  timeout: 5m
  path: ./clusters/elektrokube
  sourceRef:
    kind: GitRepository
    name: elektrokube-storage
  prune: true
  deletionPolicy: Orphan
  # Children wait for their own Helm releases; this parent manages itself too.
  wait: false

